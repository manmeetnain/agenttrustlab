services:
  agenttrustlab:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      AGENTTRUST_DB: /data/agenttrustlab.db
      AGENTTRUST_API_TOKEN: ${AGENTTRUST_API_TOKEN:-}
    volumes:
      - agenttrustlab-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  agenttrustlab-data:

